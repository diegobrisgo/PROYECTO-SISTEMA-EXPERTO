<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Tenis</title>
    <style>
        /* Estilo general */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 90%;
            margin: auto;
            overflow: hidden;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 20px;
        }

        a:hover {
            background-color: #45a049;
        }

        form {
            margin: 20px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        form label, form select, form input, form button {
            margin: 5px;
        }

        form select, form input, form button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        form button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        form button:hover {
            background-color: #45a049;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        .tenis-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tenis-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .tenis-item h2 {
            margin: 10px 0;
            font-size: 20px;
            color: #333;
        }

        .tenis-item p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }

        .tenis-item img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Catálogo de Tenis</h1>
    <div class="container">
        <a href="/add">Agregar Tenis</a>
        <form method="GET" action="/">
            <label for="marca">Marca:</label>
            <select name="marca" id="marca">
                <option value="">Todas</option>
                <option value="Nike">Nike</option>
                <option value="Adidas">Adidas</option>
                <option value="Puma">Puma</option>
            </select>
            <label for="genero">Género:</label>
            <select name="genero" id="genero">
                <option value="">Todos</option>
                <option value="Hombre">Hombre</option>
                <option value="Mujer">Mujer</option>
                <option value="Unisex">Unisex</option>
            </select>
            <label for="talla">Talla:</label>
            <input type="number" name="talla" id="talla" placeholder="Ej: 40">
            <button type="submit">Filtrar</button>
        </form>

        <ul class="tenis-list">
            {% for tenis in tenis %}
            <li class="tenis-item">
                <h2>{{ tenis.nombre }}</h2>
                <p>Marca: {{ tenis.marca }}</p>
                <p>Talla: {{ tenis.talla }}</p>
                <p>Género: {{ tenis.genero }}</p>
                <p>Disponibilidad: {{ tenis.disponibilidad }}</p>
                {% if tenis.imagen %}
                <img src="{{ tenis.imagen }}" alt="{{ tenis.nombre }}">
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
